[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "descry"
version = "1.0.0"
description = "Identify, decode, and crack classical ciphers from the command line"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zer0k7" }]
keywords = ["ctf", "cryptography", "cipher", "cli", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
descry = "descry.cli:main"

[project.urls]
Homepage = "https://github.com/zer0k7/descry"
Repository = "https://github.com/zer0k7/descry"
Issues = "https://github.com/zer0k7/descry/issues"

[tool.setuptools.packages.find]
include = ["descry*"]
